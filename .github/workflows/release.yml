name: 'C++ CI/CD'

on:
  push:
    branches:
      - main
      - feature/github_actions

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
        shell: bash

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPATCH_VERSION=${{ github.run_number }}
        shell: bash

      - name: Build
        run: cmake --build build --config Release
        shell: bash

      # --- Linux: запускаем и загружаем ---
      - name: Run on Ubuntu
        if: runner.os == 'Linux'
        run: |
          chmod +x build/LAB6
          ./build/LAB6
        shell: bash

      - name: Upload artifact (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lab6-ubuntu-latest
          path: build/LAB6
          if-no-files-found: error

      # --- Windows: ищем .exe, копируем в известное место, запускаем ---
      - name: Find and prepare executable (Windows)
        if: runner.os == 'Windows'
        run: |
          $exe = Get-ChildItem -Recurse -Path build -Filter "LAB6.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "build/LAB6.exe" -Force
            Write-Host "Found: $($exe.FullName)"
            Write-Host "Copied to: build/LAB6.exe"
          } else {
            Write-Host "ERROR: LAB6.exe not found in build directory!"
            Get-ChildItem -Recurse build | Select-Object FullName
            exit 1
          }
        shell: pwsh

      - name: Run on Windows
        if: runner.os == 'Windows'
        run: .\build\LAB6.exe
        shell: pwsh

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lab6-windows-latest
          path: build/LAB6.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/lab6-ubuntu-latest/LAB6
            artifacts/lab6-windows-latest/LAB6.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}